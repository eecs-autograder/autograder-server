name: Lint & Test Autograder Server

on:
  push:
    branches: [ release* ]
  pull_request:
  workflow_dispatch: # for testing changes before making a PR

jobs:
  lint:
    runs-on: ubuntu-24.04

    # Required for checking migrations and schema
    services: &shared_services
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/deps
        with:
          include-dev: true
      - uses: ./.github/actions/lint

  test:
    runs-on: ubuntu-24.04
    needs: lint

    services: *shared_services

    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/deps
        with:
          include-dev: false
      - uses: ./.github/actions/test

  slow_tests:
    runs-on: ubuntu-24.04
    needs: lint

    services: *shared_services

    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/deps
        with:
          include-dev: false
      - uses: ./.github/actions/slow_tests
